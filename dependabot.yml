version: 2
updates:
  - package-ecosystem: npm
    directory: /psyche-core
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
# The supabase-js browser script is loaded from a CDN with a pinned version in psyche-core/index.html.
# Dependabot cannot see it: review it monthly (docs/SECURITY.md, "Dependency process").
