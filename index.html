<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Psyche Core · PRISM personality analysis</title>
<meta name="description" content="A 40-question personality instrument across five dimensions — Perception, Response, Identity, Social, Motivation. An optional free account syncs your result across devices; without one, nothing leaves your device.">
<style>
:root{
  --bg:#FFFDF8; --surf:#FFFDF8; --surf2:#F7F2E6; --ink:#171410; --mut:#6B6455; --faint:#A39B87;
  --line:#EAE3D3; --accent:#171410;
  --P:#6D28D9; --R:#1D4ED8; --I:#B45309; --S:#BE123C; --M:#047857;
  --radius:14px;
}
[data-theme="dark"]{
  --bg:#0F0E14; --surf:#191822; --surf2:#211F2C; --ink:#F5F4FA; --mut:#A5A1B8; --faint:#6D6980;
  --line:#2A2836; --accent:#F5F4FA;
  --P:#8B5CF6; --R:#3D82F6; --I:#FBBF24; --S:#FB5D8A; --M:#2DD4A0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
.wrap{max-width:720px;margin:0 auto;padding:20px 20px 80px}
.eb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);font-weight:650}
.mono{font-family:'SF Mono',ui-monospace,Menlo,monospace}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-0.01em}
.sub{color:var(--mut);line-height:1.6;margin:0}
.card{background:var(--surf2);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}
.mt14{margin-top:14px}.mt18{margin-top:18px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.row{display:flex}
.between{justify-content:space-between}
.center{align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surf2);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font-size:12.5px;margin:3px 4px 3px 0}
.pdot{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill-row{display:flex;flex-wrap:wrap}
.btn{appearance:none;border:none;border-radius:12px;padding:14px 22px;font-size:15px;font-weight:650;
  cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn:active{opacity:.7}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;position:sticky;top:0;
  background:var(--bg);z-index:5;border-bottom:1px solid transparent}
.wordmark{font-weight:800;font-size:17px;letter-spacing:-0.02em}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surf2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}
/* home */
.hero{padding:40px 0 10px}
.hero h1{font-size:34px;line-height:1.15}
.hero .sub{font-size:15px;margin-top:10px;max-width:44ch}
.factrow{display:flex;gap:20px;margin-top:22px;flex-wrap:wrap}
.fact{flex:1;min-width:120px}
.fact b{font-size:20px;display:block}
.fact span{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:0.5px}
/* assessment */
.qwrap{min-height:60vh;display:flex;flex-direction:column;justify-content:center}
.progresstrack{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:28px}
.progressfill{height:100%;background:var(--ink);transition:width .25s}
.qtext{font-size:22px;font-weight:600;line-height:1.35;letter-spacing:-0.01em}
.likert{display:flex;flex-direction:column;gap:10px;margin-top:32px}
.likertbtn{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surf2);color:var(--ink);
  border-radius:12px;padding:15px 16px;font-size:14.5px;font-family:inherit;cursor:pointer;display:flex;
  align-items:center;gap:12px}
.likertbtn:active{opacity:.7}
.likertbtn .num{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--faint);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--faint)}
.qnav{display:flex;justify-content:space-between;margin-top:20px}
.linkbtn{background:none;border:none;color:var(--mut);font-size:13.5px;cursor:pointer;padding:8px;font-family:inherit}
/* results */
.archline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.archname{font-size:26px}
.arccode{font-size:12px;font-weight:700;letter-spacing:1px}
.dimrow{display:flex;align-items:center;gap:12px;margin-top:12px}
.dimlabel{width:96px;font-size:13px;color:var(--mut);flex:none}
.dimtrack{flex:1;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.dimfill{height:100%;border-radius:4px}
.dimval{width:30px;text-align:right;font-size:12.5px;font-weight:600}
.facetgroup{margin-top:10px}
.facetrow{padding:12px 0;border-top:1px solid var(--line)}
.facetrow:first-child{border-top:none}
.facethead{display:flex;justify-content:space-between;font-size:13.5px;font-weight:650}
.facetdesc{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.55}
.facetbar{height:5px;background:var(--surf);border-radius:3px;overflow:hidden;margin-top:8px}
.facetbarfill{height:100%;border-radius:3px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-top:24px;border-bottom:1px solid var(--line)}
.tab{padding:10px 4px;font-size:13.5px;font-weight:600;color:var(--faint);white-space:nowrap;cursor:pointer;
  border-bottom:2px solid transparent;margin-right:18px}
.tab.active{color:var(--ink);border-bottom-color:var(--ink)}
.confbadge{font-family:'SF Mono',ui-monospace,monospace;font-size:11px;color:var(--faint)}
footer.privacy{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);line-height:1.6}
.canvaswrap{display:flex;justify-content:center;margin-top:14px}
canvas{max-width:100%;border-radius:10px}

/* ---------------- PDF EXPORT (print) ---------------- */
/* auth */
.field{display:block;margin-top:14px}
.field span{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:6px}
.input{width:100%;padding:13px 14px;font-size:16px;font-family:inherit;color:var(--ink);background:var(--surf);
  border:1px solid var(--line);border-radius:12px;outline:none}
.input:focus{border-color:var(--ink)}
.msg{font-size:13px;line-height:1.5;padding:10px 12px;border-radius:10px;margin-top:14px}
.msg.err{background:rgba(190,18,60,.1);color:var(--S);border:1px solid rgba(190,18,60,.3)}
.msg.ok{background:rgba(4,120,87,.1);color:var(--M);border:1px solid rgba(4,120,87,.3)}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn.signedin{background:var(--ink);color:var(--bg)}
.print-only{display:none}
#printReport{background:#fff;color:#171410}
.preport-header{border-bottom:2px solid #171410;padding-bottom:14px;margin-bottom:20px}
.preport-header h1{font-size:26px;margin:0}
.preport-meta{font-size:11px;color:#6B6455;margin-top:4px;font-family:ui-monospace,monospace}
.preport-dimrow{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px}
.preport-dimlabel{width:90px;flex:none;color:#6B6455}
.preport-track{flex:1;height:6px;background:#F0EAD9;border-radius:3px;overflow:hidden}
.preport-fill{height:100%}
.preport-val{width:26px;text-align:right;font-weight:600}
.preport-section{margin-top:22px;page-break-inside:avoid}
.preport-section h2{font-size:15px;margin:0 0 6px;border-left:3px solid #171410;padding-left:10px}
.preport-section p{font-size:12px;line-height:1.65;color:#333;margin:6px 0}
.preport-facet{margin-top:10px;padding-top:8px;border-top:1px solid #EAE3D3;page-break-inside:avoid}
.preport-facet .fh{display:flex;justify-content:space-between;font-size:12.5px;font-weight:650}
.preport-facet p{font-size:11.5px;color:#555;margin:3px 0 0}
.preport-footer{margin-top:30px;padding-top:12px;border-top:1px solid #EAE3D3;font-size:10px;color:#A39B87}

@media print{
  @page{margin:18mm 16mm}
  body > *{display:none !important}
  #printReport{display:block !important}
  #printReport .preport-page-break{page-break-before:always}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printReport" class="print-only"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="core-logic.js"></script>
<script src="implications_data.js"></script>
<script src="deep-analysis.js"></script>
<script src="engine-plus.js"></script>
<script src="group-insights.js"></script>
<script src="app-core.js"></script>
</body>
</html>
